name: Publish Python package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install packaging tools
        run: python -m pip install pip==26.0.1 setuptools==80.10.2 wheel==0.46.3 twine==7.0.0
      - name: Build distributions
        run: |
          python -m pip wheel --no-deps --no-build-isolation . --wheel-dir dist
          python -c 'from setuptools.build_meta import build_sdist; build_sdist("dist")'
          python -m twine check --strict dist/*
      - name: Check an installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/aea-package-check"
          "$RUNNER_TEMP/aea-package-check/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/aea-package-check/bin/python" packaging/check_installation.py --source . --out "$RUNNER_TEMP/aea installation check"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
